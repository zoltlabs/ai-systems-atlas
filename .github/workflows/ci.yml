name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # OG images are generated locally and committed (see README). CI checks that the
      # committed set still matches the routes rather than regenerating them.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify
